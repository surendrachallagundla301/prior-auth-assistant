spring:
  application:
    name: prior-auth-assistant
  datasource:
    url: jdbc:h2:mem:priorauth;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

phi:
  # Dev-only key so the app runs out of the box. Override with PHI_ENCRYPTION_KEY in any real environment.
  encryption-key: ${PHI_ENCRYPTION_KEY:ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=}

server:
  error:
    include-message: never
    include-stacktrace: never
